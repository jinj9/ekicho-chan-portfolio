server.port=8080

# Expose only the health endpoint. Environment, beans and metrics remain unavailable.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Mail delivery failure must not remove a healthy API instance from service.
management.health.mail.enabled=false

#OSの環境変数"SPRING_PROFILES_ACTIVE"を読み込む
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

#環境変数に設定されている値に応じてプロファイルを上書きする（local=ローカル、production=本番）
spring.profiles.group.local=local
spring.profiles.group.production=production

#環境変数を指定してjarを実行する
#/usr/bin/java -jar /usr/local/station_project/jar/demo-0.0.1-SNAPSHOT.jar --spring.profiles.active=production

