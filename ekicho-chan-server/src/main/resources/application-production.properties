#\u672C\u756A\u74B0\u5883\u7528\u306E\u30D7\u30ED\u30D1\u30C6\u30A3\u30D5\u30A1\u30A4\u30EB

server.port=${PORT:8080}

app.auth.session.web-timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
app.auth.session.android-timeout=${APP_AUTH_SESSION_ANDROID_TIMEOUT:24h}
spring.session.timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
spring.session.jdbc.initialize-schema=never

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The production database is initialized with the legacy station/image tables
# before Flyway starts. Baseline that schema at version 0 so every managed
# migration, beginning with V1, is still applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Production mail delivery. Missing required values make startup fail safely.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.auth.mail.from=${MAIL_FROM}

# Comma-separated exact origins. Wildcards are rejected by ApiSecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# HTTPS is terminated by the load balancer/reverse proxy.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
