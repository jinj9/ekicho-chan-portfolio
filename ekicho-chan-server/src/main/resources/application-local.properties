# Local development profile. Supply the database password through an environment variable.

server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ekicho_chan_local}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The local database already contains the legacy station tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Local email capture (Mailpit). Do not point this profile at a real SMTP service.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.auth.mail.from=${MAIL_FROM:no-reply@ekicho-chan.local}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

app.auth.session.web-timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
app.auth.session.android-timeout=${APP_AUTH_SESSION_ANDROID_TIMEOUT:24h}
spring.session.timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
spring.session.jdbc.initialize-schema=never
