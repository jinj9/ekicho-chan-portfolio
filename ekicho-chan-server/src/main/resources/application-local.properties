#\u30ED\u30FC\u30AB\u30EB\u74B0\u5883\u7528\u306E\u30D7\u30ED\u30D1\u30C6\u30A3\u30D5\u30A1\u30A4\u30EB

server.port=8080

#postgres\u63A5\u7D9A\u60C5\u5831
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/ekicho_chan_local
spring.datasource.username=ekicho1
spring.datasource.password=${DB_PASSWORD:replace_me}

# The local database already contains the legacy station tables.
# Register that existing schema as version 0, then apply migrations from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Local email capture (Mailpit). Do not point this profile at a real SMTP service.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
app.portfolio-mode=${APP_PORTFOLIO_MODE:false}
spring.mail.properties.mail.smtp.starttls.enable=false
app.auth.mail.from=no-reply@ekicho-chan.local

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Android sessions are transported in X-Auth-Token and stored in PostgreSQL.
# Values may be shortened locally, e.g. APP_AUTH_SESSION_ANDROID_TIMEOUT=30s.
app.auth.session.web-timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
app.auth.session.android-timeout=${APP_AUTH_SESSION_ANDROID_TIMEOUT:24h}
# Fallback timeout for sessions created outside the login endpoints.
spring.session.timeout=${APP_AUTH_SESSION_WEB_TIMEOUT:12h}
spring.session.jdbc.initialize-schema=never
