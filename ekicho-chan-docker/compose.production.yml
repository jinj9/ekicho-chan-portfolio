name: ekicho-chan-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      APP_DB_PASSWORD: ${SPRING_DB_PASSWORD:?Set SPRING_DB_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./init-production
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./init
        target: /seed
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ekicho_chan_local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    shm_size: 128m
    mem_limit: 768m
    logging: *default-logging

  spring:
    image: ${SPRING_IMAGE:?Set SPRING_IMAGE to the ECR image URI in .env.production}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/ekicho_chan_local
      DB_USERNAME: ekicho1
      DB_PASSWORD: ${SPRING_DB_PASSWORD:?Set SPRING_DB_PASSWORD in .env.production}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env.production}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env.production}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env.production}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ekichochan.com}
      APP_PORTFOLIO_MODE: ${APP_PORTFOLIO_MODE:-false}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *default-logging

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      spring:
        condition: service_healthy
    environment:
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?Set ORIGIN_VERIFY_SECRET in .env.production}
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/templates
        target: /etc/nginx/templates
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

volumes:
  postgres-data:
