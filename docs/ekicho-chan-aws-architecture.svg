<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">えきちょーちゃん AWSアーキテクチャ</title>
  <desc id="desc">WebブラウザとAndroidアプリからCloudFrontを経由し、ReactはS3、APIはEC2内のNginx、Spring Boot、PostgreSQLへ接続する構成図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Yu Gothic', Meiryo, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px 'Yu Gothic', Meiryo, sans-serif; fill: #475569; }
      .group-title { font: 700 20px 'Yu Gothic', Meiryo, sans-serif; fill: #334155; }
      .node-title { font: 700 19px 'Yu Gothic', Meiryo, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 15px 'Yu Gothic', Meiryo, sans-serif; fill: #475569; text-anchor: middle; }
      .edge-label { font: 600 14px 'Yu Gothic', Meiryo, sans-serif; fill: #334155; text-anchor: middle; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .aws-node { fill: #fff7ed; stroke: #fb923c; stroke-width: 2.5; filter: url(#shadow); }
      .app-node { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2.5; filter: url(#shadow); }
      .db-node { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2.5; filter: url(#shadow); }
      .ops-node { fill: #faf5ff; stroke: #c084fc; stroke-width: 2; filter: url(#shadow); }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="55" class="title" text-anchor="middle">えきちょーちゃん AWSアーキテクチャ</text>
  <text x="800" y="86" class="subtitle" text-anchor="middle">React Web・Android・Spring Boot・PostgreSQLを一つのドメインで公開</text>

  <!-- Clients -->
  <rect x="55" y="140" width="245" height="130" rx="18" class="app-node"/>
  <text x="177" y="181" class="node-title">Webブラウザ</text>
  <text x="177" y="211" class="node-text">React Web</text>
  <text x="177" y="237" class="node-text">Cookie + CSRF</text>

  <rect x="55" y="330" width="245" height="130" rx="18" class="app-node"/>
  <text x="177" y="371" class="node-title">Androidアプリ</text>
  <text x="177" y="401" class="node-text">Jetpack Compose</text>
  <text x="177" y="427" class="node-text">X-Auth-Token</text>

  <rect x="55" y="760" width="245" height="130" rx="18" class="ops-node"/>
  <text x="177" y="801" class="node-title">開発・運用者</text>
  <text x="177" y="831" class="node-text">AWS CLI / SSO</text>
  <text x="177" y="857" class="node-text">デプロイスクリプト</text>

  <!-- AWS boundary -->
  <rect x="350" y="115" width="1195" height="820" rx="26" fill="#ffffff" fill-opacity="0.58" stroke="#f59e0b" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="382" y="98" width="102" height="34" rx="17" fill="#f59e0b"/>
  <text x="433" y="121" font-family="'Yu Gothic', Meiryo, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">AWS</text>

  <!-- Entry -->
  <rect x="395" y="185" width="210" height="110" rx="16" class="aws-node"/>
  <text x="500" y="226" class="node-title">Route 53</text>
  <text x="500" y="257" class="node-text">ekichochan.com</text>

  <rect x="690" y="185" width="245" height="110" rx="16" class="aws-node"/>
  <text x="812" y="226" class="node-title">CloudFront</text>
  <text x="812" y="257" class="node-text">HTTPS・パス振り分け</text>

  <rect x="1040" y="145" width="210" height="90" rx="16" class="aws-node"/>
  <text x="1145" y="180" class="node-title">ACM</text>
  <text x="1145" y="208" class="node-text">TLS証明書</text>

  <rect x="1040" y="260" width="210" height="100" rx="16" class="aws-node"/>
  <text x="1145" y="300" class="node-title">Amazon S3</text>
  <text x="1145" y="330" class="node-text">React静的ファイル</text>

  <!-- EC2 boundary -->
  <rect x="620" y="410" width="850" height="335" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="650" y="447" class="group-title">EC2: ekicho-chan-prod</text>

  <rect x="665" y="485" width="210" height="120" rx="16" class="node"/>
  <text x="770" y="524" class="node-title">Nginx</text>
  <text x="770" y="554" class="node-text">リバースプロキシ</text>
  <text x="770" y="580" class="node-text">オリジンヘッダー検証</text>

  <rect x="940" y="485" width="220" height="120" rx="16" class="app-node"/>
  <text x="1050" y="524" class="node-title">Spring Boot</text>
  <text x="1050" y="554" class="node-text">REST API / 認証</text>
  <text x="1050" y="580" class="node-text">駅取得・管理機能</text>

  <rect x="1225" y="485" width="200" height="120" rx="16" class="db-node"/>
  <text x="1325" y="524" class="node-title">PostgreSQL 17</text>
  <text x="1325" y="554" class="node-text">ユーザー・駅</text>
  <text x="1325" y="580" class="node-text">セッション・収集</text>

  <rect x="1225" y="642" width="200" height="70" rx="16" class="db-node"/>
  <text x="1325" y="672" class="node-title">Docker Volume</text>
  <text x="1325" y="697" class="node-text">DBデータ永続化</text>

  <!-- Supporting services -->
  <rect x="395" y="790" width="200" height="100" rx="16" class="aws-node"/>
  <text x="495" y="829" class="node-title">Amazon ECR</text>
  <text x="495" y="859" class="node-text">Dockerイメージ</text>

  <rect x="665" y="790" width="215" height="100" rx="16" class="ops-node"/>
  <text x="772" y="829" class="node-title">Systems Manager</text>
  <text x="772" y="859" class="node-text">EC2遠隔操作</text>

  <rect x="950" y="790" width="200" height="100" rx="16" class="aws-node"/>
  <text x="1050" y="829" class="node-title">Amazon SES</text>
  <text x="1050" y="859" class="node-text">確認・再設定メール</text>

  <rect x="1225" y="790" width="200" height="100" rx="16" class="ops-node"/>
  <text x="1325" y="829" class="node-title">AWS Budgets</text>
  <text x="1325" y="859" class="node-text">料金アラート</text>

  <!-- Main request flow -->
  <path d="M300 205 H395" class="line"/>
  <path d="M300 395 H338 V240 H395" class="line"/>
  <text x="346" y="192" class="edge-label">HTTPS</text>
  <path d="M605 240 H690" class="line"/>
  <path d="M935 222 H1000 V310 H1040" class="line"/>
  <text x="986" y="282" class="edge-label">画面</text>
  <path d="M812 295 V380 H770 V485" class="line"/>
  <text x="855" y="385" class="edge-label">/api/*</text>
  <path d="M875 545 H940" class="line"/>
  <path d="M1160 545 H1225" class="line"/>
  <path d="M1325 605 V642" class="line"/>
  <path d="M1040 190 H970 V205 H935" class="dash"/>
  <text x="984" y="177" class="edge-label">証明書</text>

  <!-- Ops and supporting flow -->
  <path d="M300 825 H395" class="line"/>
  <path d="M300 850 H350 V920 H772 V890" class="dash"/>
  <path d="M595 840 H620 V650 H940 V605" class="dash"/>
  <text x="690" y="639" class="edge-label">DockerイメージをPull</text>
  <path d="M880 840 H905 V715 H940" class="dash"/>
  <text x="886" y="754" class="edge-label">遠隔操作</text>
  <path d="M1050 605 V790" class="line"/>
  <text x="1085" y="710" class="edge-label">SMTP/TLS</text>

  <!-- Legend -->
  <rect x="405" y="948" width="18" height="18" rx="4" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="434" y="962" class="subtitle">アプリ</text>
  <rect x="520" y="948" width="18" height="18" rx="4" fill="#fff7ed" stroke="#fb923c"/>
  <text x="549" y="962" class="subtitle">AWSサービス</text>
  <rect x="695" y="948" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="724" y="962" class="subtitle">データ</text>
  <rect x="815" y="948" width="18" height="18" rx="4" fill="#faf5ff" stroke="#c084fc"/>
  <text x="844" y="962" class="subtitle">運用</text>
  <text x="1510" y="964" class="subtitle" text-anchor="end">2026-10-04 現行構成</text>
</svg>
